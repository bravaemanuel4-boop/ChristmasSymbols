
name: Build ChristmasSymbols

on:
  workflow_dispatch:
  push:
    paths:
      - "ChristmasSymbols-source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source files
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract ZIP
        run: |
          unzip -o ChristmasSymbols-source.zip -d extracted

      - name: Show extracted files
        run: |
          find extracted -type f

      - name: Set target framework to .NET 10
        run: |
          sed -i 's/net8.0/net10.0/g' extracted/ChristmasSymbols/ChristmasSymbols.csproj

      - name: Fix source compatibility
        run: |
          sed -i 's/\.SteamId\.ToString()/\.SteamId64.ToString()/g' extracted/ChristmasSymbols/ChristmasSymbolsPlugin.cs
          sed -i '1i using Microsoft.Extensions.Logging;' extracted/ChristmasSymbols/ChristmasSymbolsPlugin.cs

      - name: Build plugin
        run: |
          dotnet build extracted/ChristmasSymbols/ChristmasSymbols.csproj --configuration Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ChristmasSymbols-DLL
          path: extracted/ChristmasSymbols/bin/Release/net10.0/
